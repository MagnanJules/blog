apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog
  annotations:
    cert-manager.io/cluster-issuer: ${ACME_ISSUER}
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - ${PUBLIC_DOMAIN}
      secretName: blog-tls
  rules:
    - host: ${PUBLIC_DOMAIN}
      http:
        paths:
          - path: /blog
            pathType: Prefix
            backend:
              service:
                name: blog
                port:
                  number: 80
